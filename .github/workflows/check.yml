name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write # 回写 .github/last-run.txt 需要写权限 (防 60 天停用定时任务)
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 回写 commit 需要完整历史 (pull --rebase 用)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker: 密钥路径来自仓库 Secret CHECK_TOKEN (与 Worker 的 AUTH_PATH 变量同值)
          # 未配置 Secret 时回退裸路径 (仅当 Worker 未设置 AUTH_PATH 时可用)
          CHECK_WORKER: ${{ secrets.CHECK_TOKEN && format('https://chks5.8dy.xx.kg/{0}/check?sstp=vpn:vpn@', secrets.CHECK_TOKEN) || 'https://chks5.8dy.xx.kg/check?sstp=vpn:vpn@' }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # sub.txt 订阅含 UUID: 默认不发布 (PUBLISH_SUB 未设置即跳过); 需要时配 Secret EDT_UUID 并加 PUBLISH_SUB=1
          EDT_UUID: ${{ secrets.EDT_UUID }}

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://whua898.github.io/wh-gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'

      - name: Push hosts.txt to edgetunnel admin (自定义优选IP, 自动化)
        env:
          EDT_BASE: ${{ secrets.EDT_BASE }}
          EDT_ADMIN_PASSWORD: ${{ secrets.EDT_ADMIN_PASSWORD }}
          # 优先用本次刚生成的本地文件 (不依赖 Pages CDN 生效延迟), 再回退在线地址/上游
          HOSTS_FILE: public/hosts.txt
          HOSTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hosts.txt
        run: |
          if [ -z "$EDT_ADMIN_PASSWORD" ]; then
            echo "跳过: 未配置仓库 Secret EDT_ADMIN_PASSWORD。"
            echo "配置 Secrets -> EDT_ADMIN_PASSWORD (edgetunnel 的 ADMIN 密码) 后即可全自动同步后台。"
            exit 0
          fi
          python push_edt_hosts.py

      - name: Commit run state (keep scheduled workflow alive)
        # 每 30 分钟跑一次也产生一次 commit -> 仓库永远有"活动",
        # 防止 GitHub 因"公开仓库 60 天无活动"自动停用定时任务。
        # 这只是触发器，不影响 push 并发（失败时不阻塞）。
        # 只有定时触发才提交, 手动 workflow_dispatch 不提交。
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "$TS" > .github/last-run.txt
          git add .github/last-run.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: scheduled run at $TS [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push 冲突, 重试 $i/5 ..."
            sleep 10
          done
