name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。
  # 想改频率: 每 5 分钟 = "*/5 * * * *" (GitHub Actions 允许的最短间隔); 每 60 分钟 = "0 * * * *"。
  # ⚠️ fork 仓库限制: 公开仓库被 fork 后 GitHub 默认停用该 fork 的 schedule,
  #    表现为 workflow_dispatch 能跑、schedule 一次都不跑。修复见 README「定时任务不触发」。
  # ⚠️ 非 fork 也可能一次 schedule 都不跑: GitHub 侧「定时注册」丢失 (官方确认过同类故障)。
  #    补救顺序: ① Actions → Disable workflow → Enable workflow 强制重注册;
  #    ② 往默认分支推一次 commit (push 会重新注册定时, 同时重置计时);
  #    ③ 仍不跑就改用 README「五、常见问题 → 定时任务不触发」里的外部定时器方案。
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write # 回写 .github/last-run.txt 需要写权限 (防 60 天停用定时任务)
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ⚠️ deploy-pages 必需: 部署作业必须声明 github-pages 环境, 否则 API
    #    返回 400 "Missing environment" (实测: run 36956204020, Deploy to
    #    GitHub Pages 步骤)。url 引用部署输出, 跑完后 Environments 页显示站点链接。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 回写 commit 需要完整历史 (pull --rebase 用)

      - name: Preflight - 检查 Pages 是否已启用 (无法自动开启, 只给提示)
        # ⚠️ 为什么不能自动启用: 建站属「仓库管理」操作, GitHub 出于安全明确禁止
        #    Actions 默认 GITHUB_TOKEN 执行 (无论 permissions: 怎么写都不行;
        #    configure-pages 的 enablement 也必须有 PAT / GitHub App Token)。
        #    所以 Pages 必须手动开一次:
        #    Settings → Pages → Build and deployment → Source = GitHub Actions。
        #    本步骤提前检查并给出中文指引, 免得白等 2~10 分钟才在 Configure Pages 处
        #    抛一句难懂的英文 Not Found。
        # ⚠️ 该端点必须带 token 查询: 匿名请求对任何仓库都返回 404 (实测连已启用
        #    Pages 的公开仓库也是 404), 不能用匿名结果判断是否已启用。
        #    带 token 时: 已启用 = 200, 未启用 = 404 —— 与 Configure Pages 判定一致。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages")
            echo "尝试 $i: Pages API status = $code"
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" = "200" ]; then
            echo "GitHub Pages 已启用, 继续。"
          elif [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages 尚未启用::请到仓库 Settings → Pages → Build and deployment → Source 选 'GitHub Actions' 后重新运行 (GitHub 禁止 Actions 自动启用 Pages, 只能手动开一次)"
            exit 1
          else
            echo "::warning title=无法确认 Pages 状态::API 返回 $code, 跳过预检, 交由后续 Configure Pages 判定。"
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker: 密钥路径来自仓库 Secret CHECK_TOKEN (与 Worker 的 AUTH_PATH 变量同值)
          # 未配置 Secret 时回退裸路径 (仅当 Worker 未设置 AUTH_PATH 时可用)
          CHECK_WORKER: ${{ secrets.CHECK_TOKEN && format('https://chks5.8dy.xx.kg/{0}/check?sstp=vpn:vpn@', secrets.CHECK_TOKEN) || 'https://chks5.8dy.xx.kg/check?sstp=vpn:vpn@' }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # 生成的 hosts.txt/chains.txt/sub.txt 头部注释写「每 X 分钟重新检测」:
          # 必须与上面的 cron 间隔一致 (改 cron 时同步改这里, 否则注释与实际频率对不上)。
          # Actions 不会把 cron 表达式注入 job, 只能用这个自描述变量显式声明。
          REFRESH_MINUTES: "5"
          # sub.txt 订阅含 UUID: 默认不发布 (PUBLISH_SUB 未设置即跳过); 需要时配 Secret EDT_UUID 并加 PUBLISH_SUB=1
          EDT_UUID: ${{ secrets.EDT_UUID }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show site URL
        # 用 Pages 部署步骤的官方输出, 不写死地址 (仓库改名/换账号后自动正确)
        run: 'echo "site: ${{ steps.deployment.outputs.page_url }} (deploy outcome: ${{ steps.deployment.outcome }})"'

      - name: Push hosts.txt to edgetunnel admin (自定义优选IP, 自动化)
        env:
          EDT_BASE: ${{ secrets.EDT_BASE }}
          EDT_ADMIN_PASSWORD: ${{ secrets.EDT_ADMIN_PASSWORD }}
          # 优先用本次刚生成的本地文件 (不依赖 Pages CDN 生效延迟), 再回退在线地址/上游
          HOSTS_FILE: public/hosts.txt
          HOSTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hosts.txt
        run: |
          if [ -z "$EDT_ADMIN_PASSWORD" ]; then
            echo "跳过: 未配置仓库 Secret EDT_ADMIN_PASSWORD。"
            echo "配置 Secrets -> EDT_ADMIN_PASSWORD (edgetunnel 的 ADMIN 密码) 后即可全自动同步后台。"
            exit 0
          fi
          python push_edt_hosts.py

      - name: Commit run state (keep scheduled workflow alive)
        # 每 30 分钟跑一次也产生一次 commit -> 仓库永远有"活动",
        # 防止 GitHub 因"公开仓库 60 天无活动"自动停用定时任务。
        # 这只是触发器，不影响 push 并发（失败时不阻塞）。
        # 只有定时触发才提交, 手动 workflow_dispatch 不提交。
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "$TS" > .github/last-run.txt
          git add .github/last-run.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: scheduled run at $TS [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push 冲突, 重试 $i/5 ..."
            sleep 10
          done
